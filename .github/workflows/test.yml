name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv test-venv
          test-venv\Scripts\python.exe -m pip install --upgrade pip --quiet
          test-venv\Scripts\python.exe -m pip install setuptools --quiet
          test-venv\Scripts\python.exe -m pip install -r requirements.txt --quiet
          test-venv\Scripts\python.exe -m pip install pytest --quiet
        shell: cmd

      - name: Run unit tests
        run: test-venv\Scripts\python.exe -m pytest tests/ -v
        shell: cmd
